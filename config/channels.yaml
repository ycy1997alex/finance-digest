# 上傳清單 ID = channel_id 的 UC 前綴換成 UU。
# 篩選：長度須超過 min_duration_sec；title_include 非空時標題須符合；title_exclude 非空時標題不得符合（皆為正規表示式）。
# 規則依 2026-10-04 近 30 天統計（phase0/videos.csv）與本人決定訂定。
# captions：2026-10-03 抽查最新 2 支影片的字幕狀態（disabled = 頻道關閉字幕），供 D4／D6 決策參考。
# weekend_only：只收進週日的週末版，範圍是上一份週日版之後一週內上架的影片（ToDo.md 3.2 節「週末版」）。
# publish_weekdays：只收這幾天上架的影片（1＝週一 … 7＝週日），沒寫就不限。

