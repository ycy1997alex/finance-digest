<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>財經節目每日摘要</title>
<script>
// 先套用個人偏好（字級、配色），避免畫面先閃一下預設樣式
try {
  var t = localStorage.getItem("fd-theme"), f = localStorage.getItem("fd-fs");
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  if (f === "2" || f === "3") document.documentElement.setAttribute("data-fs", f);
  if (localStorage.getItem("fd-width") === "wide") document.documentElement.classList.add("layout-wide");
} catch (e) {}
</script>
<style>
:root{
  --bg:#f5f4f0; --surface:#ffffff; --surface-2:#efede8; --line:#e2dfd7; --line-2:#d3cfc5;
  --fg:#1d2127; --muted:#5f6670; --faint:#9399a3;
  --accent:#2952c4; --accent-ink:#ffffff; --accent-tint:#e7edfb;
  --bull:#c42f2a; --bull-tint:#fbe8e7; --bull-ink:#ffffff;
  --bear:#15804a; --bear-tint:#e3f3ea; --bear-ink:#ffffff;
  --neutral:#646b75; --neutral-tint:#ecedef;
  --warn:#9a5a00; --warn-tint:#fff1d6;
  --shadow:0 1px 2px rgba(20,20,10,.04),0 6px 20px rgba(20,20,10,.05);
  --radius:16px; --topbar-h:57px;
  --page-w:820px;   /* 閱讀寬度，與 ycy1997alex.github.io 的 .container 相同 */
  color-scheme:light;
}
/* 滿版寬度：只在電腦版生效（手機本來就比 820px 窄，按鈕也藏起來），做法同 ycy1997alex.github.io */
@media (min-width:768.1px){html.layout-wide{--page-w:none}}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1014; --surface:#161a21; --surface-2:#1d222b; --line:#272d38; --line-2:#343b48;
    --fg:#e8eaef; --muted:#9ba3b4; --faint:#6a7386;
    --accent:#7ea4ff; --accent-ink:#0e1014; --accent-tint:rgba(126,164,255,.14);
    --bull:#ff6a62; --bull-tint:rgba(255,106,98,.14); --bull-ink:#1c0a09;
    --bear:#3dcf8b; --bear-tint:rgba(61,207,139,.13); --bear-ink:#06180f;
    --neutral:#9ba3b4; --neutral-tint:rgba(155,163,180,.14);
    --warn:#f1b55c; --warn-tint:rgba(241,181,92,.14);
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1014; --surface:#161a21; --surface-2:#1d222b; --line:#272d38; --line-2:#343b48;
  --fg:#e8eaef; --muted:#9ba3b4; --faint:#6a7386;
  --accent:#7ea4ff; --accent-ink:#0e1014; --accent-tint:rgba(126,164,255,.14);
  --bull:#ff6a62; --bull-tint:rgba(255,106,98,.14); --bull-ink:#1c0a09;
  --bear:#3dcf8b; --bear-tint:rgba(61,207,139,.13); --bear-ink:#06180f;
  --neutral:#9ba3b4; --neutral-tint:rgba(155,163,180,.14);
  --warn:#f1b55c; --warn-tint:rgba(241,181,92,.14);
  --shadow:none; color-scheme:dark;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
html[data-fs="2"]{font-size:18px}
html[data-fs="3"]{font-size:20px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);line-height:1.75;letter-spacing:.01em;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.proto{background:var(--warn-tint);color:var(--warn);font-size:.78rem;text-align:center;padding:5px 16px;line-height:1.5}

/* ---------- 解鎖頁 ---------- */
.gate{min-height:calc(100vh - 30px);display:grid;place-items:center;padding:24px 16px}
.gate-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 24px;box-shadow:var(--shadow)}
.gate-card h1{margin:0;font-size:1.35rem}
.gate-card .sub{color:var(--muted);font-size:.88rem;margin:6px 0 18px;line-height:1.7}
.pw{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:12px;background:var(--bg);padding:0 4px 0 12px}
.pw:focus-within{border-color:var(--accent)}
.pw input{flex:1;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;padding:11px 0;min-width:0}
.gate .btn.primary{width:100%;justify-content:center;margin-top:14px;padding:11px}
.err{color:var(--bull);font-size:.85rem;min-height:1.5em;margin-top:8px}
.fine{margin:12px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted);line-height:1.7}

/* ---------- 頁首與導覽 ---------- */
.mark{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mark svg{stroke-width:2.6}
.gate-card .mark{width:46px;height:46px;border-radius:14px;margin-bottom:14px}
.topbar{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);
  background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3)}
.topbar .inner{max-width:var(--page-w);margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:1.02rem;letter-spacing:.04em;margin-right:auto;white-space:nowrap}
.mainnav{display:flex;gap:4px}
.mainnav a{text-decoration:none;padding:6px 12px;border-radius:10px;color:var(--muted);font-weight:700;font-size:.92rem}
.mainnav a:hover{background:var(--surface-2);color:var(--fg)}
.mainnav a.on{color:var(--fg);background:var(--surface-2)}
.tools{display:flex;gap:2px}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}
.tabbar{display:none}
main{max-width:var(--page-w);margin:0 auto;padding:18px 16px 56px}
html.layout-wide #btnWidth{color:var(--accent);background:var(--accent-tint)}
@media (max-width:768px){#btnWidth{display:none}}
@media (max-width:639px){
  .mainnav,#btnSettings{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;border-top:1px solid var(--line);
    background:var(--surface);background:color-mix(in srgb,var(--surface) 92%,transparent);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border:0;background:transparent;
    text-decoration:none;color:var(--muted);font-size:.7rem;font-weight:700;cursor:pointer}
  .tabbar .on{color:var(--accent)}
  .tabbar svg{width:1.55em;height:1.55em}
  main{padding-bottom:100px}
}

/* ---------- 共用元件 ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);
  color:var(--fg);font-size:.9rem;font-weight:700;cursor:pointer;text-decoration:none;line-height:1.5}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:progress}
.btn.sm{padding:4px 11px;font-size:.82rem;border-radius:9px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700;
  background:var(--neutral-tint);color:var(--neutral);white-space:nowrap}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--accent-tint);color:var(--accent)}
.badge.partial{background:var(--warn-tint);color:var(--warn)}
.badge.bull{background:var(--bull-tint);color:var(--bull)}
.badge.bear{background:var(--bear-tint);color:var(--bear)}
.att{display:inline-flex;align-items:center;padding:1px 9px;border-radius:999px;font-size:.78rem;font-weight:800;white-space:nowrap;line-height:1.7}
.att.b1{background:var(--bull);color:var(--bull-ink)}
.att.b2{background:var(--bull-tint);color:var(--bull)}
.att.n{background:var(--neutral-tint);color:var(--neutral)}
.att.s2{background:var(--bear-tint);color:var(--bear)}
.att.s1{background:var(--bear);color:var(--bear-ink)}
.conf,.hz{font-size:.78rem;color:var(--muted);white-space:nowrap}
.who{display:inline-flex;align-items:center;font-size:.78rem;font-weight:800;color:var(--accent);background:var(--accent-tint);
  border-radius:7px;padding:0 7px;margin-right:6px;text-decoration:none;line-height:1.75;vertical-align:1px;white-space:nowrap}
.who:hover{text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ind{display:inline-flex;align-items:center;gap:6px;padding:1px 10px;border-radius:999px;font-size:.85rem;font-weight:700;
  background:var(--surface-2);text-decoration:none;max-width:100%;overflow-wrap:anywhere}
.ind.bull{background:var(--bull-tint);color:var(--bull)}
.ind.bear{background:var(--bear-tint);color:var(--bear)}
a.ind:hover{text-decoration:underline}
.code{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
.code.tbd{color:var(--warn)}
.stk-link{font-weight:800;text-decoration:none}
.stk-link:hover{color:var(--accent);text-decoration:underline}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--surface-2);color:var(--fg);flex:none}
.an-id{min-width:0;flex:1;display:flex;flex-direction:column}
.an-name{font-weight:800}
.an-ch{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);font-size:.92rem;margin:0}
.sub-h{font-size:.76rem;color:var(--muted);font-weight:800;letter-spacing:.08em;margin:14px 0 6px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--muted);text-decoration:none;font-size:.88rem;font-weight:700;margin-bottom:8px}
.back:hover{color:var(--accent)}
.page-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:2px 0 14px}
.page-h h1{margin:0;font-size:1.5rem}
.aside{color:var(--muted);font-size:.82rem;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,8px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;
  font-size:.88rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:639px){.toast{bottom:92px}}

/* ---------- 報告：頁頭 ---------- */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.hero-top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px}
.eyebrow{font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:.1em}
.hero h1{margin:2px 0 0;font-size:1.8rem;line-height:1.3;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.hero h1 small{font-size:1rem;color:var(--muted);font-weight:700;margin-left:8px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
/* 涵蓋／產生於／更新於：每項不在中間斷行；手機一項一行 */
.stamps{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:2px 18px;color:var(--muted);font-size:.86rem;line-height:1.6;font-variant-numeric:tabular-nums}
.stamps li{white-space:nowrap}
.stamps .k{font-weight:700;margin-right:6px}
@media (max-width:639px){.stamps{flex-direction:column}}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.banner{display:flex;gap:10px;margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--warn-tint);font-size:.9rem;line-height:1.65}
.banner > svg{color:var(--warn);margin-top:.15em}
.banner b{color:var(--warn)}
.banner ul{margin:4px 0 0;padding-left:1.1em}

/* ---------- 報告：日期列與章節列 ---------- */
.strip{display:flex;align-items:center;gap:6px;margin:16px 0 0}
.strip .scroller{position:relative;display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px}
.strip .scroller::-webkit-scrollbar{display:none}
.dchip{flex:none;position:relative;display:flex;flex-direction:column;align-items:center;min-width:56px;padding:5px 8px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface);text-decoration:none;line-height:1.3}
.dchip .d{font-weight:800;font-size:.92rem;font-variant-numeric:tabular-nums}
.dchip .w{font-size:.72rem;color:var(--muted)}
.dchip.partial::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.dchip:hover{border-color:var(--accent)}
.dchip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.dchip.on .w{color:inherit;opacity:.75}
.navbtn{flex:none;width:38px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;
  color:var(--muted);text-decoration:none}
.navbtn:hover{border-color:var(--accent);color:var(--accent)}
.navbtn.off{opacity:.35;pointer-events:none}
.secnav{position:sticky;top:var(--topbar-h);z-index:20;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:10px 16px;
  background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.secnav::-webkit-scrollbar{display:none}
.secnav a{flex:none;text-decoration:none;padding:4px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);
  font-size:.85rem;font-weight:700}
.secnav a.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-tint)}

/* ---------- 報告：章節 ---------- */
.sec{margin-top:24px;scroll-margin-top:calc(var(--topbar-h) + 66px)}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:1.12rem;font-weight:800;letter-spacing:.03em}
.sec-h .aside{margin-left:auto}
.focus{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.focus li{position:relative;padding-left:18px}
.focus li::before{content:"";position:absolute;left:2px;top:.72em;width:7px;height:7px;border-radius:2px;background:var(--accent)}
.focus li:first-child{font-size:1.06rem;font-weight:700}
.list{margin:0;padding:0;list-style:none}
.list > li{padding:12px 0;border-top:1px solid var(--line)}
.list > li:first-child{border-top:0;padding-top:0}
.list > li:last-child{padding-bottom:0}
.cgrid{display:grid;gap:12px}
@media (min-width:760px){.cgrid{grid-template-columns:1fr 1fr}}
.cbox{border-top:4px solid var(--bull)}
.cbox.bear{border-top-color:var(--bear)}
.cbox h3{margin:0;font-size:1rem}
.cbox.bull h3{color:var(--bull)}
.cbox.bear h3{color:var(--bear)}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:7px 0;border-top:1px dashed var(--line)}
.sub-h + .crow{border-top:0}
.whos{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
.whos .who{margin:0}
.cbox .empty{margin-top:10px}
.dv{display:grid;gap:12px}
.dv-item .topic{font-weight:800;margin-bottom:4px}
.side{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 12px;border-radius:10px;margin-top:6px}
.side.bull{background:var(--bull-tint)}
.side.bear{background:var(--bear-tint)}
.side .lab{font-weight:800;font-size:.85rem}
.side.bull .lab{color:var(--bull)}
.side.bear .lab{color:var(--bear)}
.an-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:-2px 0 2px}
.an-fold{display:flex;gap:8px}
.an-tools .seg{margin-left:auto;padding:3px;gap:3px}
.an-tools .seg button{padding:3px 14px;font-size:.84rem}
#s-analysts[data-view="table"] .an-cards,#s-analysts[data-view="table"] .an-fold{display:none}
#s-analysts:not([data-view="table"]) .an-tables{display:none}
/* 比較表格：只有表格本身左右捲動，頁面不跟著變寬；第一欄固定 */
.tbl-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:18px 0 8px;font-size:1rem}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:.88rem;line-height:1.6}
.tbl th,.tbl td{padding:8px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tbl thead th{border-top:0;background:var(--surface-2);font-size:.78rem;color:var(--muted);font-weight:800;white-space:nowrap}
.tbl .sticky{position:sticky;left:0;z-index:1;background:var(--surface);border-right:1px solid var(--line);white-space:nowrap}
.tbl thead .sticky{background:var(--surface-2);z-index:2}
.tbl td.wide{min-width:13em}
.tbl td.mid{min-width:9em}
.tbl .none{color:var(--faint)}
.tbl .code{margin-left:5px}
.tstk{white-space:nowrap}
.tstk + .tstk{margin-top:3px}
.mx td,.mx thead th:not(.sticky){text-align:center;vertical-align:middle}
.mx td.cnt{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
details.an{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-top:10px;box-shadow:var(--shadow);overflow:hidden}
details.an > summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 14px 13px 16px;cursor:pointer}
details.an > summary::-webkit-details-marker{display:none}
details.an > summary:hover .an-name{color:var(--accent)}
.chev{transition:transform .2s;color:var(--faint)}
details[open] .chev{transform:rotate(90deg)}
.an-body{padding:2px 16px 16px;border-top:1px solid var(--line)}
.fields{display:grid;grid-template-columns:5.2em 1fr;gap:8px 12px;margin:14px 0 0}
.fields dt{color:var(--muted);font-size:.85rem;font-weight:800;padding-top:.12em}
.fields dd{margin:0;min-width:0}
.tl{margin:0;padding:0;list-style:none}
.tl li{display:flex;gap:8px}
.tl .t{font-weight:800;white-space:nowrap}
.stk{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:var(--bg)}
.stk-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.stk .reason{margin-top:4px;font-size:.95rem}
.chain{display:inline-block;margin-top:6px;font-size:.78rem;color:var(--muted);background:var(--surface-2);padding:1px 8px;border-radius:6px}
.more{display:inline-block;margin-top:12px;font-size:.85rem;font-weight:800;color:var(--accent);text-decoration:none}
.more:hover{text-decoration:underline}
.sources{margin:0;padding:0;list-style:none}
.sources li{display:grid;grid-template-columns:1.8em 1fr;gap:2px 8px;padding:10px 0;border-top:1px solid var(--line)}
.sources li:first-child{border-top:0;padding-top:0}
.src-n{font-weight:800;color:var(--faint);font-variant-numeric:tabular-nums}
.src-title{font-weight:700;text-decoration:none;overflow-wrap:anywhere}
.src-title svg{width:.95em;height:.95em;color:var(--faint);vertical-align:-1px}
.src-title:hover{color:var(--accent);text-decoration:underline}
.src-meta{grid-column:2;font-size:.8rem;color:var(--muted)}
.missing{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--warn-tint);font-size:.9rem}

<script>
"use strict";
(() => {
/* ======================================================================
 * 財經節目每日摘要。內容全部是密文：密碼 → PBKDF2 → 解開 data/keyring.json 的主金鑰
 * → 解開 data/index.enc（各期清單與追蹤索引）與 data/r/日期.enc（每期報告）。
 * 格式與 Python 的 finance_digest_a/crypto.py 相同。sessionStorage 只存主金鑰，不存密碼。
 * 所有內容都是模型輸出，一律經 esc() 轉義後才放進 HTML。
 * ==================================================================== */
const SITE_TITLE = "財經節目每日摘要";
const KEY_STORE = "fd-mk";
const MAX_AGE_MS = 24 * 60 * 60 * 1000;
const WD = ["日", "一", "二", "三", "四", "五", "六"];
const ATTS = ["看多", "偏多", "中性", "偏空", "看空"];

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const sess = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { sessionStorage.removeItem(k); } catch (e) {} },
};

/* ---------- 日期工具（一律用 UTC 運算，避免時區位移） ---------- */
const pad = n => String(n).padStart(2, "0");
const toDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const toKey = t => `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}`;
const addDays = (t, n) => new Date(t.getTime() + n * 86400000);
const slash = s => s.replaceAll("-", "/");
const wd = s => WD[toDate(s).getUTCDay()];
const md = s => `${+s.slice(5, 7)}/${+s.slice(8, 10)}`;
const hm = iso => iso ? iso.slice(11, 16) : "";
const stamp = iso => iso ? `${slash(iso.slice(0, 10))} ${hm(iso)}` : "";
const dateLabel = d => `${slash(d)}（${wd(d)}）`;
function isoWeek(t) {
  const d = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate()));
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  return Math.ceil(((d - Date.UTC(d.getUTCFullYear(), 0, 1)) / 86400000 + 1) / 7);
}

const ICON = {
  copy: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
  link: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg>',
  left: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  right: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  search: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>',
  ext: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>',
  warn: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.5h.01"/></svg>',
};

/* ======================================================================
 * 解密（與 crypto.py 相同：PBKDF2-SHA256、AES-GCM 256、gzip）
 * ==================================================================== */
const enc = new TextEncoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = bytes => { let s = ""; for (const b of bytes) s += String.fromCharCode(b); return btoa(s); };
let MK = null, INDEX = null;
const CACHE = new Map();

async function fetchJson(path) {
  const r = await fetch(path, { cache: "no-cache" });
  if (!r.ok) throw new Error(`讀取失敗：${path}（HTTP ${r.status}）`);
  return r.json();
}

async function useKey(bytes) {
  MK = await crypto.subtle.importKey("raw", bytes, { name: "AES-GCM" }, false, ["decrypt"]);
}

async function unlockWith(password) {
  const ring = await fetchJson("data/keyring.json");
  const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  const kek = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(ring.salt), iterations: ring.kdf.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  let raw;
  try {
    raw = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(ring.iv), additionalData: enc.encode("fd-keyring-v1") },
      kek, b64(ring.wrapped)));
  } catch (e) { return false; }   // AES-GCM 驗證失敗＝密碼錯，不會吐出半段明文
  await useKey(raw);
  sess.set(KEY_STORE, JSON.stringify({ mk: b64e(raw), at: Date.now() }));
  return true;
}

async function openSealed(env) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(env.iv), additionalData: enc.encode("fd-content-v1") },
    MK, b64(env.ct));
  const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}

async function loadReport(day) {
  if (!CACHE.has(day)) CACHE.set(day, await openSealed(await fetchJson(`data/r/${day}.enc`)));
  return CACHE.get(day);
}

/* ---------- 索引：各期狀態、個股與分析師的歷次紀錄 ---------- */
let DATES = [], META = new Map(), LATEST = null, CURRENT = null;
let STOCK_IDX = new Map(), ANALYST_IDX = new Map();
const cleanCode = c => c ? String(c).split("，")[0] : null;      // 「2303，與證交所資料不符」→ 2303
const badCode = c => !!c && String(c).includes("，");
const stockKey = (name, code) => (code && !badCode(code)) ? code : name;   // 代號不符時改用股名，免得併進別檔
const sideOf = a => (a === "看多" || a === "偏多") ? 1 : (a === "偏空" || a === "看空") ? -1 : 0;
const attCls = a => ({ "看多": "b1", "偏多": "b2", "中性": "n", "偏空": "s2", "看空": "s1" }[a] || "n");

function buildIndexes(ix) {
  DATES = ix.dates.map(d => d.date);
  META = new Map(ix.dates.map(d => [d.date, d]));
  LATEST = DATES[0] || null;
  STOCK_IDX = new Map();
  for (const m of ix.mentions) {
    const key = stockKey(m.s, m.c);
    const e = STOCK_IDX.get(key) || { key, name: m.s, code: badCode(m.c) ? null : m.c, mentions: [] };
    e.mentions.push({ date: m.d, who: m.w, attitude: m.a, confidence: m.f, horizon: m.h, reason: m.r });
    STOCK_IDX.set(key, e);
  }
  ANALYST_IDX = new Map(ix.analysts.map(a => [a.name, { name: a.name, channels: a.channels,
    days: a.days.map(d => ({ date: d.d, attitude: d.a, confidence: d.f, topic: d.t, view: d.v,
      stocks: d.s.map(([name, attitude, code]) => ({ name, attitude, code })) })) }]));
}

/* ---------- 共用片段 ---------- */
const attBadge = a => a ? `<span class="att ${attCls(a)}">${esc(a)}</span>` : "";
const whoLink = n => ANALYST_IDX.has(n) ? `<a class="who" href="#/analyst/${encodeURIComponent(n)}">${esc(n)}</a>` : `<span class="who plain">${esc(n)}</span>`;
const codeHtml = c => !c ? `<span class="code tbd">代號待確認</span>`
  : badCode(c) ? `<span class="code tbd">${esc(cleanCode(c))}（與證交所資料不符）</span>` : `<span class="code">${esc(c)}</span>`;
const stockLink = s => `<a class="stk-link" href="#/stock/${encodeURIComponent(stockKey(s.name, s.code))}">${esc(s.name)}</a>${codeHtml(s.code)}`;
const sideCls = a => sideOf(a) > 0 ? "bull" : sideOf(a) < 0 ? "bear" : "";
const attLegend = `<div class="legend">${ATTS.map(a => `<span><i class="q-${attCls(a)}"></i>${a}</span>`).join("")}<span><i></i>未出現</span></div>`;
const notice = (msg, back) => `${back ? `<a class="back" href="${back}">${ICON.left}返回</a>` : ""}<div class="card"><p class="empty">${esc(msg)}</p></div>`;
const safeUrl = u => /^https:\/\/www\.youtube\.com\/watch\?v=[\w-]+$/.test(u || "") ? u : null;
const basePath = () => location.pathname.replace(/index\.html$/, "");
const pageUrl = d => `${location.origin}${basePath()}${d}/`;

/* ======================================================================
 * 視圖：報告
 * ==================================================================== */
async function viewReport(day) {
  if (!LATEST) return notice("目前還沒有報告。第一份報告會在交易日晚上 21:42 後產生。");
  const d = META.has(day) ? day : LATEST;
  const r = await loadReport(d);
  CURRENT = d;
  const i = DATES.indexOf(d);
  const older = DATES[i + 1], newer = DATES[i - 1];
  const lo = Math.max(0, Math.min(i - 4, DATES.length - 9));
  const win = DATES.slice(lo, lo + 9).reverse();

  const hero = `<div class="hero">
    <div class="hero-top">
      <div><div class="eyebrow">${r.edition === "weekend" ? "財經節目週末版" : "財經節目綜合摘要"}</div><h1>${slash(d)}<small>星期${wd(d)}</small></h1></div>
      <div class="badges">
        ${r.status === "partial" ? `<span class="badge partial"><span class="dot"></span>部分缺漏</span>` : `<span class="badge ok"><span class="dot"></span>完整</span>`}
        <span class="badge">來源 ${r.coverage.included}／${r.coverage.expected}</span>
        ${r.updated_at ? `<span class="badge">已更新</span>` : ""}
      </div>
    </div>
    <ul class="stamps">
      <li><span class="k">涵蓋</span>${esc(r.window)}</li>
      <li><span class="k">產生於</span>${esc(stamp(r.generated_at))}</li>
      ${r.updated_at ? `<li><span class="k">更新於</span>${esc(stamp(r.updated_at))}</li>` : ""}
    </ul>
    <div class="actions">
      <button class="btn primary" data-act="copy-line">${ICON.copy}複製 LINE 版</button>
      <button class="btn" data-act="share">${ICON.link}複製這一期的連結</button>
    </div>
    ${r.missing.length ? `<div class="banner">${ICON.warn}<div><b>本期缺 ${r.missing.length} 個節目，內容不完整</b><ul>${r.missing.map(m => `<li>${esc(m)}</li>`).join("")}</ul></div></div>` : ""}
  </div>`;

  const strip = `<div class="strip" aria-label="切換日期">
    <a class="navbtn${older ? "" : " off"}" href="${older ? `#/d/${older}` : "#"}" aria-label="上一期">${ICON.left}</a>
    <div class="scroller">${win.map(x => `<a class="dchip${x === d ? " on" : ""}${META.get(x).status === "partial" ? " partial" : ""}" href="#/d/${x}"${x === d ? ' aria-current="page"' : ""}><span class="d">${md(x)}</span><span class="w">週${wd(x)}</span></a>`).join("")}</div>
    <a class="navbtn${newer ? "" : " off"}" href="${newer ? `#/d/${newer}` : "#"}" aria-label="下一期">${ICON.right}</a>
  </div>`;

  const secs = [];
  if (!r.parse_ok) {
    secs.push(["s-raw", "全文", `<section class="sec" id="s-raw"><h2 class="sec-h">📄 報告全文</h2><div class="card"><pre class="raw">${esc(r.raw)}</pre></div></section>`]);
  } else {
    secs.push(["s-focus", "焦點", `<section class="sec" id="s-focus"><h2 class="sec-h">📌 今日焦點</h2>
      <div class="card"><ul class="focus">${r.focus.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div></section>`]);
    if (r.macro.length) secs.push(["s-macro", "總經", `<section class="sec" id="s-macro"><h2 class="sec-h">📢 總體經濟與市場環境</h2>
      <div class="card"><ul class="list">${r.macro.map(m => `<li>${m.who.map(whoLink).join("")}${esc(m.text)}</li>`).join("")}</ul></div></section>`]);
    secs.push(["s-consensus", "多空共識", `<section class="sec" id="s-consensus"><h2 class="sec-h">📊 多空共識<span class="aside">兩位以上分析師同方向才列入</span></h2>
      <div class="cgrid">${consensusBox(r, "bull")}${consensusBox(r, "bear")}</div></section>`]);
    if (r.divergences.length) secs.push(["s-diverge", "分歧", `<section class="sec" id="s-diverge"><h2 class="sec-h">⚖️ 主要分歧</h2>
      <div class="dv">${r.divergences.map(dv => `<div class="card dv-item"><div class="topic">${esc(dv.topic)}</div>${dv.sides.map(s => {
        const side = /^(看多|偏多|看好)/.test(s.text) ? "bull" : /^(看空|偏空|看壞)/.test(s.text) ? "bear" : "neutral";
        return `<div class="side ${side}"><span class="lab">${{ bull: "多方", bear: "空方", neutral: "觀點" }[side]}</span><span>${whoLink(s.who)}${esc(s.text)}</span></div>`;
      }).join("")}</div>`).join("")}</div></section>`]);

  secs.push(["s-sources", "來源", sourcesHtml(r)]);

  const secnav = `<nav class="secnav" aria-label="章節">${secs.map(([id, label], k) => `<a href="#" data-target="${id}" class="${k === 0 ? "on" : ""}">${label}</a>`).join("")}</nav>`;

    <p class="disclaimer">本頁由 AI 依各節目內容自動整理，只轉述節目中講者的觀點，不代表本站立場，也不構成任何投資建議。股票代號經臺灣證券交易所 ISIN 清單比對；標示「代號待確認」的是節目沒有明確提到、或比對不到的股票。</p>`;
  return { html: hero + strip + secnav + secs.map(s => s[2]).join("") + foot, title: `${slash(d)} · ${SITE_TITLE}` };
}

function consensusBox(r, side) {
  const c = r.consensus[side];
  const label = side === "bull" ? "📈 一致看多" : "📉 一致看空";
  const rows = (items, isStock) => items.map(x => `<div class="crow">${isStock ? stockLink(x) : `<span class="ind ${side}">${esc(x.name)}</span>`}<span class="whos">${x.who.map(whoLink).join("")}</span></div>`).join("");
  const body = (!c.ind.length && !c.stk.length) ? `<p class="empty">今日無此共識</p>`
    : (c.ind.length ? `<div class="sub-h">產業／主題</div>${rows(c.ind, false)}` : "") + (c.stk.length ? `<div class="sub-h">個股</div>${rows(c.stk, true)}` : "");
  return `<div class="card cbox ${side}"><h3>${label}</h3>${body}</div>`;
}

/* 比較表格（一）：每列一位分析師，橫向比較態度、主題、產業與個股 */
const analystLink = n => `<a class="stk-link" href="#/analyst/${encodeURIComponent(n)}">${esc(n)}</a>`;
const stockNameLink = s => `<a class="stk-link" href="#/stock/${encodeURIComponent(stockKey(s.name, s.code))}">${esc(s.name)}</a>`;
const NONE = `<span class="none">—</span>`;
function analystTable(r) {
  const inds = (xs, side) => xs.length ? `<div class="chips">${xs.map(x => `<span class="ind ${side}">${esc(x)}</span>`).join("")}</div>` : NONE;

/* 比較表格（二）：列是本期被提到的個股，欄是分析師，格子是態度；被越多人提到的排越前面 */
function stockMatrix(r) {
  const cols = r.analysts.filter(a => a.stocks.length);
  const rows = new Map();
  for (const a of cols) for (const s of a.stocks) {
    const k = stockKey(s.name, s.code);
    const e = rows.get(k) || { s, by: new Map() };
    if (!e.by.has(a.name)) e.by.set(a.name, s.attitude);
    rows.set(k, e);
  }
  if (!rows.size) return "";
  const list = [...rows.values()].sort((p, q) => q.by.size - p.by.size);
  return `<h3 class="tbl-h">個股 × 分析師<span class="aside">${list.length} 檔 · 格子是態度，空白＝沒提到</span></h3>
    <div class="tbl-wrap"><table class="tbl mx"><thead><tr><th class="sticky" scope="col">個股</th><th scope="col">人數</th>${cols.map(a => `<th scope="col">${analystLink(a.name)}</th>`).join("")}</tr></thead>
    <tbody>${list.map(e => `<tr><th class="sticky" scope="row">${stockLink(e.s)}</th><td class="cnt">${e.by.size}</td>${cols.map(a => `<td>${attBadge(e.by.get(a.name))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

/* ======================================================================
 * 視圖：封存（月份頁籤 + 每列一個 ISO 週的月曆）
 * ==================================================================== */
function viewArchive(ym) {
  if (!LATEST) return { html: notice("目前還沒有報告。"), title: `封存 · ${SITE_TITLE}` };
  const months = [...new Set(DATES.map(d => d.slice(0, 7)))];
  const cur = months.includes(ym) ? ym : (CURRENT ? CURRENT.slice(0, 7) : months[0]);
  const inMonth = DATES.filter(d => d.startsWith(cur));
  const partial = inMonth.filter(d => META.get(d).status === "partial").length;
  const [y, m] = cur.split("-").map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1)), last = new Date(Date.UTC(y, m, 0));
  const rows = [];
  // 跨月的 ISO 週只列本月的日期，另一個月的格子留白
  for (let wk = addDays(first, -((first.getUTCDay() + 6) % 7)); wk <= last; wk = addDays(wk, 7)) {
    const cells = [];
    for (let k = 0; k < 7; k++) {
      const t = addDays(wk, k), key = toKey(t), meta = META.get(key);
      if (t.getUTCMonth() !== m - 1) cells.push("<td></td>");
      else if (meta) cells.push(`<td><a class="day ${meta.status}${key === CURRENT ? " cur" : ""}" href="#/d/${key}" aria-label="${dateLabel(key)}${meta.status === "partial" ? "，有缺漏" : ""}">${t.getUTCDate()}<span class="mk"></span></a></td>`);
      else cells.push(`<td><span class="day${key > LATEST ? " future" : ""}">${t.getUTCDate()}</span></td>`);
    }
    rows.push(`<tr><td class="wk">W${isoWeek(wk)}</td>${cells.join("")}</tr>`);
  }
  return { title: `封存 · ${SITE_TITLE}`, html: `<div class="page-h"><h1>封存</h1><span class="aside">共 ${DATES.length} 期 · 點日期打開當天報告</span></div>
    <div class="tabs" role="tablist">${months.map(mm => `<a href="#/archive/${mm}" role="tab" aria-selected="${mm === cur}" class="${mm === cur ? "on" : ""}">${+mm.slice(0, 4)} 年 ${+mm.slice(5)} 月</a>`).join("")}</div>
    <div class="stats"><div class="stat"><div class="v">${inMonth.length}</div><div class="k">本月期數</div></div>
      <div class="stat"><div class="v">${inMonth.length - partial}</div><div class="k">完整</div></div>
      <div class="stat"><div class="v">${partial}</div><div class="k">有缺漏</div></div></div>
    <div class="card cal-card"><table class="cal"><thead><tr><th class="wk">週</th>${"一二三四五六日".split("").map(x => `<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>
      <div class="legend"><span><i style="background:var(--accent)"></i>完整</span><span><i style="background:var(--warn)"></i>有缺漏</span><span>灰色數字：休市或沒有新節目；更淡的是還沒到的日期</span></div></div>` };
}

/* ======================================================================
 * 視圖：追蹤（搜尋、熱門個股、分析師）
 * ==================================================================== */
function viewTrack() {
  if (!LATEST) return { html: notice("目前還沒有報告。"), title: `追蹤 · ${SITE_TITLE}` };
  const cutoff = toKey(addDays(toDate(LATEST), -30));
  const hot = [...STOCK_IDX.values()].filter(s => s.code).map(s => {
    const ms = s.mentions.filter(x => x.date > cutoff);
    const b = ms.filter(x => sideOf(x.attitude) > 0).length, sn = ms.filter(x => sideOf(x.attitude) < 0).length;
    return { s, n: ms.length, b, sn, neu: ms.length - b - sn };
  }).filter(x => x.n).sort((p, q) => q.n - p.n || q.b - p.b);
  const pct = (v, n) => `${(v / n * 100).toFixed(1)}%`;
  const rank = hot.map((x, i) => `<li><a href="#/stock/${encodeURIComponent(x.s.key)}">
      <span class="no">${i + 1}</span><span><b>${esc(x.s.name)}</b> ${codeHtml(x.s.code)}</span><span class="cnt">${x.n} 次</span>
      <span class="bar" aria-hidden="true"><i class="b" style="width:${pct(x.b, x.n)}"></i><i class="n" style="width:${pct(x.neu, x.n)}"></i><i class="s" style="width:${pct(x.sn, x.n)}"></i></span>
      <span class="mix">看多 ${x.b} · 中性 ${x.neu} · 看空 ${x.sn}</span></a></li>`).join("");
  const last10 = DATES.slice(0, 10).reverse();
  const people = [...ANALYST_IDX.values()].sort((p, q) => q.days.length - p.days.length).map(a => {
    const by = new Map(a.days.map(d => [d.date, d]));
    const mini = last10.map(d => { const x = by.get(d); return `<i class="${x ? "q-" + attCls(x.attitude) : ""}" title="${md(d)} ${x ? esc(x.attitude) : "未出現"}"></i>`; }).join("");
    return `<a href="#/analyst/${encodeURIComponent(a.name)}"><span class="avatar">${esc(a.name[0])}</span>
      <span class="an-id"><span class="an-name">${esc(a.name)}</span><span class="an-ch">${esc(a.channels.join("、"))} · ${a.days.length} 期</span><span class="mini" aria-hidden="true">${mini}</span></span>
      ${attBadge(a.days[0].attitude)}</a>`;
  }).join("");
  return { title: `追蹤 · ${SITE_TITLE}`, html: `<div class="page-h"><h1>追蹤</h1><span class="aside">統計最近 30 天</span></div>
    <div class="search"><div class="box">${ICON.search}<input id="q" type="search" placeholder="搜尋股名、代號或分析師，例如 台積電、2330" autocomplete="off" enterkeyhint="search" aria-label="搜尋個股或分析師"></div>
      <div class="sugg" id="sugg" hidden></div></div>
    <div class="grid2">
      <section class="card"><h2 class="sec-h">🔥 熱門個股<span class="aside">依被提及次數</span></h2><ol class="rank">${rank || '<li class="empty">近 30 天沒有個股紀錄</li>'}</ol>
        ${hot.length > 10 ? `<div class="rank-more"><button class="btn sm" data-act="rank-more" aria-expanded="false">顯示更多（共 ${hot.length} 檔）</button><span hidden>清單內可上下捲動</span></div>` : ""}</section>
      <section class="card"><h2 class="sec-h">👤 分析師<span class="aside">小方塊＝最近 10 期態度</span></h2><div class="alist">${people}</div></section>
    </div>` };
}

function bindSearch() {
  const q = $("#q"), box = $("#sugg");
  if (!q) return;
  const all = [
    ...[...STOCK_IDX.values()].map(s => ({ kind: "個股", label: s.name, sub: s.code || "代號待確認", href: `#/stock/${encodeURIComponent(s.key)}`, keys: [s.name, s.code || ""] })),
    ...[...ANALYST_IDX.values()].map(a => ({ kind: "分析師", label: a.name, sub: a.channels.join("、"), href: `#/analyst/${encodeURIComponent(a.name)}`, keys: [a.name] })),
  ];
  let hits = [], hl = 0;
  const draw = v => {
    box.innerHTML = hits.length
      ? hits.map((h, i) => `<a href="${h.href}" class="${i === hl ? "hl" : ""}"><span class="kind">${h.kind}</span><b>${esc(h.label)}</b><span class="an-ch">${esc(h.sub)}</span></a>`).join("")
      : `<div class="none">找不到「${esc(v)}」</div>`;
    box.hidden = !v;
  };
  q.addEventListener("input", () => {
    const v = q.value.trim().toLowerCase();
    hits = v ? all.filter(h => h.keys.some(k => k.toLowerCase().includes(v))).slice(0, 8) : [];
    hl = 0; draw(q.value.trim());
  });
  q.addEventListener("keydown", e => {
    if (!hits.length) return;
    if (e.key === "ArrowDown") { hl = (hl + 1) % hits.length; draw(q.value.trim()); e.preventDefault(); }
    else if (e.key === "ArrowUp") { hl = (hl - 1 + hits.length) % hits.length; draw(q.value.trim()); e.preventDefault(); }
    else if (e.key === "Enter") { location.hash = hits[hl].href; e.preventDefault(); }
  });
  q.addEventListener("blur", () => setTimeout(() => { box.hidden = true; }, 160));
  q.addEventListener("focus", () => { if (q.value.trim()) box.hidden = false; });
}

function viewStock(key) {
  const s = STOCK_IDX.get(key);
  if (!s) return { html: notice("找不到這檔股票。", "#/track"), title: SITE_TITLE };
  const b = s.mentions.filter(x => sideOf(x.attitude) > 0).length, sn = s.mentions.filter(x => sideOf(x.attitude) < 0).length;
  const byDate = new Map();
  for (const x of s.mentions) byDate.set(x.date, [...(byDate.get(x.date) || []), x]);
  const items = [...byDate].map(([d, ms]) => `<li><a class="when" href="#/d/${d}">${dateLabel(d)}</a>${ms.map(x => `<div class="ment">
      <div class="ment-h">${whoLink(x.who)}${attBadge(x.attitude)}<span class="conf">信心 ${esc(x.confidence)} · ${esc(x.horizon)}</span></div>
      ${x.reason ? `<div class="reason">${esc(x.reason)}</div>` : ""}</div>`).join("")}</li>`).join("");
  return { title: `${s.name} · ${SITE_TITLE}`, html: `<a class="back" href="#/track">${ICON.left}追蹤</a>
    <div class="entity"><div><div class="big">${esc(s.name)}</div>${codeHtml(s.code)}</div></div>
    <div class="summary"><span class="badge">提及 ${s.mentions.length} 次</span><span class="badge bull">看多 ${b}</span>
      <span class="badge">中性 ${s.mentions.length - b - sn}</span><span class="badge bear">看空 ${sn}</span><span class="aside">最近一次 ${md(s.mentions[0].date)}</span></div>
    <div class="card"><h2 class="sec-h">歷次提及<span class="aside">新到舊</span></h2><ol class="tline">${items}</ol></div>` };
}

function viewAnalyst(name) {
  const a = ANALYST_IDX.get(name);
  if (!a) return { html: notice("找不到這位分析師。", "#/track"), title: SITE_TITLE };
  const by = new Map(a.days.map(d => [d.date, d]));
  const strip = DATES.slice(0, 30).reverse().map(d => { const x = by.get(d); return `<i class="${x ? "q-" + attCls(x.attitude) : ""}" title="${dateLabel(d)} ${x ? esc(x.attitude) : "未出現"}"></i>`; }).join("");
  const items = a.days.map(d => `<li><a class="when" href="#/d/${d.date}">${dateLabel(d.date)}</a>${attBadge(d.attitude)} <span class="conf">信心 ${esc(d.confidence)}</span>
    <div class="ment">${d.topic ? `<b>${esc(d.topic)}</b>` : ""}${d.view ? `<div class="reason">${esc(d.view)}</div>` : ""}
    ${d.stocks.length ? `<div class="chips" style="margin-top:8px">${d.stocks.map(s => `<a class="ind ${sideCls(s.attitude)}" href="#/stock/${encodeURIComponent(stockKey(s.name, s.code))}">${esc(s.name)} · ${esc(s.attitude)}</a>`).join("")}</div>` : ""}</div></li>`).join("");
  return { title: `${a.name} · ${SITE_TITLE}`, html: `<a class="back" href="#/track">${ICON.left}追蹤</a>
    <div class="entity"><span class="avatar">${esc(a.name[0])}</span><div><div class="big">${esc(a.name)}</div><div class="an-ch">${esc(a.channels.join("、"))}</div></div></div>
    <div class="summary"><span class="badge">出現 ${a.days.length} 期</span><span class="aside">最新態度</span>${attBadge(a.days[0].attitude)}</div>
    <div class="card"><h2 class="sec-h">最近 30 期的態度<span class="aside">左舊右新</span></h2><div class="strip30">${strip}</div>${attLegend}</div>
    <div class="card" style="margin-top:14px"><h2 class="sec-h">歷次觀點<span class="aside">新到舊</span></h2><ol class="tline">${items}</ol></div>` };
}

/* ======================================================================
 * 路由與互動
 * ==================================================================== */
let routeSeq = 0;
async function route() {
  const seq = ++routeSeq;
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  const view = parts[0], arg = parts[1] ? decodeURIComponent(parts[1]) : "";
  let nav = "report";
  if (view === "archive") nav = "archive";
  else if (view === "track" || view === "stock" || view === "analyst") nav = "track";
  $$("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === nav));
  $("#view").innerHTML = `<p class="loading">載入中…</p>`;
  let out;
  try {
    if (view === "archive") out = viewArchive(arg);
    else if (view === "track") out = viewTrack();
    else if (view === "stock") out = viewStock(arg);
    else if (view === "analyst") out = viewAnalyst(arg);
    else out = await viewReport(view === "d" ? arg : LATEST);
    if (typeof out === "string") out = { html: out, title: SITE_TITLE };
  } catch (e) {
    if (e && e.name === "OperationError") { lock("密碼或金鑰已更換，請重新輸入密碼"); return; }
    out = { html: notice(`讀取失敗：${e && e.message ? e.message : e}`), title: SITE_TITLE };
  }
  if (seq !== routeSeq) return;   // 使用者已經切到別頁
  $("#view").innerHTML = out.html;
  document.title = out.title;
  window.scrollTo(0, 0);
  if (nav === "track") bindSearch();
  if (nav === "report") { centerChip(); setupSpy(); } else setupSpy(true);
}

function centerChip() {
  const sc = $(".strip .scroller"), on = sc && $(".dchip.on", sc);
  if (on) sc.scrollLeft = on.offsetLeft - sc.clientWidth / 2 + on.clientWidth / 2;
}

let spyHandler = null;
function setupSpy(off) {
  if (spyHandler) window.removeEventListener("scroll", spyHandler);
  spyHandler = null;
  const nav = $(".secnav");
  if (off || !nav) return;
  const links = $$("a", nav), secs = links.map(a => document.getElementById(a.dataset.target));
  let last = -1, ticking = false;
  spyHandler = () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      const y = $("#topbar").offsetHeight + nav.offsetHeight + 24;
      let idx = 0;
      secs.forEach((s, k) => { if (s.getBoundingClientRect().top - y <= 0) idx = k; });
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) idx = secs.length - 1;
      if (idx === last) return;
      last = idx;
      links.forEach((a, k) => a.classList.toggle("on", k === idx));
      const on = links[idx];
      nav.scrollTo({ left: on.offsetLeft - nav.clientWidth / 2 + on.clientWidth / 2, behavior: "smooth" });
    });
  };
  window.addEventListener("scroll", spyHandler, { passive: true });
  spyHandler();
}

let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e2) {}
    ta.remove();
    return ok;
  }
}

document.addEventListener("click", async e => {
  const chip = e.target.closest(".secnav a");
  if (chip) { e.preventDefault(); document.getElementById(chip.dataset.target).scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "copy-line") {
    const text = CACHE.get(CURRENT)?.line_short || "";
    const n = [...text].length;
    if (await copyText(text)) toast(n > 5000 ? `已複製（${n.toLocaleString()} 字，超過 LINE 單則 5,000 字，貼上時請分兩則）` : `已複製 LINE 版（${n.toLocaleString()} 字）`);
    else toast("複製失敗，請改用長按選取");
  } else if (act === "share") {
    toast(await copyText(pageUrl(CURRENT)) ? "已複製這一期的連結" : "複製失敗");
  } else if (act === "an-view") {
    const v = el.dataset.v === "table" ? "table" : "cards";
    store.set("fd-anview", v);
    $("#s-analysts").dataset.view = v;
    $$("#s-analysts [data-act=an-view]").forEach(b => { const on = b.dataset.v === v; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
  } else if (act === "width") {
    store.set("fd-width", root.classList.toggle("layout-wide") ? "wide" : "normal");
    syncWidth();
  } else if (act === "rank-more") {
    // 展開後清單高度固定為前 10 名的高度，其餘在清單內捲動
    const ol = $(".rank"), open = !ol.classList.contains("rank-open");
    if (open) { ol.style.maxHeight = ol.offsetHeight + "px"; ol.classList.add("rank-open"); }
    else { ol.classList.remove("rank-open"); ol.style.maxHeight = ""; ol.scrollTop = 0; }
    el.setAttribute("aria-expanded", open);
    el.textContent = open ? "收合" : `顯示更多（共 ${ol.children.length} 檔）`;
    el.nextElementSibling.hidden = !open;
  } else if (act === "expand-all" || act === "collapse-all") {
    $$("details.an").forEach(d => { d.open = act === "expand-all"; });
  } else if (act === "settings") {
    syncSeg();
    $("#settings").showModal();
  } else if (act === "close-settings") {
    $("#settings").close();
  } else if (act === "lock") {
    if ($("#settings").open) $("#settings").close();
    lock("");
  }
});

/* ---------- 閱讀設定（字級、配色只存在這台裝置） ---------- */
const root = document.documentElement;
function applyFs(v) { if (v === "2" || v === "3") root.setAttribute("data-fs", v); else root.removeAttribute("data-fs"); store.set("fd-fs", v); setTopH(); }
function applyTheme(v) { if (v === "light" || v === "dark") root.setAttribute("data-theme", v); else root.removeAttribute("data-theme"); store.set("fd-theme", v); }
function syncSeg() {
  const fs = root.getAttribute("data-fs") || "1", th = root.getAttribute("data-theme") || "system";
  $$("#segFs button").forEach(b => b.classList.toggle("on", b.dataset.fs === fs));
  $$("#segTheme button").forEach(b => b.classList.toggle("on", b.dataset.theme === th));
}
function syncWidth() {
  const wide = root.classList.contains("layout-wide"), label = wide ? "切換為閱讀寬度" : "切換為滿版寬度";
  const b = $("#btnWidth");
  b.setAttribute("aria-pressed", wide); b.setAttribute("aria-label", label); b.title = label;
}
syncWidth();
$("#segFs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { applyFs(b.dataset.fs); syncSeg(); } });
$("#segTheme").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { applyTheme(b.dataset.theme); syncSeg(); } });
$("#settings").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

/* ---------- 解鎖與進站 ---------- */
function setTopH() { const t = $("#topbar"); if (t && t.offsetHeight) root.style.setProperty("--topbar-h", t.offsetHeight + "px"); }

async function enterApp() {
  INDEX = await openSealed(await fetchJson("data/index.enc"));
  buildIndexes(INDEX);
  $("#gate").hidden = true; $("#app").hidden = false;
  setTopH();
  await route();
}

function lock(message) {
  sess.del(KEY_STORE);
  MK = null; INDEX = null; CACHE.clear();
  $("#app").hidden = true; $("#gate").hidden = false;
  $("#pw").value = ""; $("#gateErr").textContent = message || "";
  $("#pw").focus();
}

$("#pwToggle").addEventListener("click", () => {
  const p = $("#pw"), show = p.type === "password";
  p.type = show ? "text" : "password";
  $("#pwToggle").setAttribute("aria-label", show ? "隱藏密碼" : "顯示密碼");
});
$("#gateForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#gateBtn"), err = $("#gateErr");
  err.textContent = ""; btn.disabled = true; btn.textContent = "解鎖中…";
  try {
    if (await unlockWith($("#pw").value)) { $("#pw").value = ""; await enterApp(); }
    else err.textContent = "密碼錯誤";
  } catch (ex) {
    err.textContent = `解鎖失敗：${ex && ex.message ? ex.message : ex}`;
  } finally {
    btn.disabled = false; btn.textContent = "解鎖";
  }
});

window.addEventListener("hashchange", () => { if (MK) route(); });
window.addEventListener("resize", setTopH);

(async () => {
  let saved = null;
  try { saved = JSON.parse(sess.get(KEY_STORE) || "null"); } catch (e) {}
  if (saved && Date.now() - saved.at < MAX_AGE_MS) {
    try { await useKey(b64(saved.mk)); await enterApp(); return; }
    catch (e) { /* 金鑰換過或資料讀不到：退回輸入密碼 */ }
  }
  lock("");
})();
})();
</script>
